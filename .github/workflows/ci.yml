name: CI

# Stage 00 established this. Before it, no CI existed: nothing ran on push, and
# every verification in HANDOFF.md §5 had been performed by hand.
#
# The four gates below already passed on a clean clone at the time they were
# added, so making them required costs nothing today and prevents regression
# from tomorrow. See docs/adr/ADR-0018-ci-quality-gates.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Stage 01 moved the transactional store to PostgreSQL (ADR-0002). Every gate
  # that touches Prisma runs against the postgres:16 service container declared
  # on the verify job; there is no SQLite path left to fall back to. The CMS
  # keeps a throwaway SQLite file here because it has no tenancy requirement and
  # its PostgreSQL adapter is exercised by the build, not by a live database.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_ci
  PAYLOAD_DATABASE_URI: file:./ci-payload.db
  # Non-secret placeholders. Long enough to pass the length check and NOT equal
  # to the .env.example value, which src/lib/auth.ts rejects by value.
  AUTH_SECRET: ci-only-not-a-real-secret-0000000000000000
  PAYLOAD_SECRET: ci-only-not-a-real-payload-secret-00000000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Verify (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # tests/rls-isolation.test.ts is the ADR-0005 tenancy proof and needs a real
    # PostgreSQL: SQLite has no row-level security, so the isolation guarantee
    # cannot be exercised against the SQLite file the rest of the suite uses.
    #
    # The service exists so the proof RUNS here rather than being skipped. The
    # test throws when CI=true and RLS_TEST_DATABASE_URL is unset, so deleting
    # this block fails the job instead of quietly turning the proof off.
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for a container that exists for the length of
          # one job, is reachable only from this runner, and holds no data. Same
          # posture as the placeholder AUTH_SECRET above: not a secret, and
          # deliberately not written to look like one.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobpilot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The mechanism proof (tests/rls-isolation.test.ts) creates its own
      # throwaway schema and role, so it can share the database the migrations
      # are applied to; the tenancy suite (tests/tenancy-isolation.test.ts) runs
      # THROUGH the migrated schema and the real Prisma client, which is the
      # point of it.
      RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_ci
      TENANCY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (from the lockfile)
        # `npm ci` is retried ONCE, and only for a specific known failure.
        #
        # esbuild's postinstall writes its binary and then immediately execs it
        # to check `--version`. On a busy runner the write handle may not be
        # closed yet, and the exec fails with ETXTBSY ("text file busy"). It
        # reached this project through @esbuild-kit/core-utils -> drizzle-kit ->
        # @payloadcms/db-*, a path no application code touches (drizzle-kit is
        # Payload's migration CLI and never runs in production).
        #
        # This is an installer race, not a lockfile problem: the same lockfile
        # installs cleanly from scratch locally, and the nested esbuild version
        # is identical on main. A single clean retry is the standard remedy.
        #
        # It is deliberately NOT silent. The retry prints a loud notice, so a
        # genuine install failure still shows up as a retry in the log rather
        # than being smoothed away, and a second failure fails the job.
        run: |
          if npm ci; then
            exit 0
          fi
          echo "::warning::npm ci failed on the first attempt. Cleaning node_modules and retrying once (see the ETXTBSY note in ci.yml)."
          rm -rf node_modules
          npm ci

      # --- required gates -------------------------------------------------
      # Each of these passed on a clean clone before CI existed. They are
      # required, not advisory.

      # --- migration validation (ADR-0002) ---------------------------------
      # The committed migration history must (a) apply cleanly to an empty
      # PostgreSQL, (b) produce exactly the schema prisma/schema.prisma
      # declares, and (c) leave `migrate status` with nothing pending. Any of
      # the three failing means someone edited the schema without a migration,
      # or a migration without the schema, and that is a red build here rather
      # than a surprise on the deploy.
      # Through the same npm scripts operators use, so the connection-string
      # normalisation wrapper (scripts/db/with-encoded-env.mjs) is exercised
      # on every push rather than only on the deploy that needs it.
      - name: Apply the migration history to an empty database
        run: npm run db:migrate:deploy

      - name: Fail if the migrated database differs from the schema
        run: npm run db:migrate:check

      - name: Fail if any migration is pending or failed
        run: npm run db:migrate:status

      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (includes the ADR-0005 RLS proof and the tenancy suite against PostgreSQL)
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (types · typecheck · test · web bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Stage 14 (ADR-0013): the Expo client is its own package under mobile/,
    # built against the frozen candidate contract. Its generated types are
    # tracked and diffed here, so a contract change that is not regenerated
    # into the app is a red build rather than a runtime mismatch on a phone.
    # The web export is the compile gate: Metro bundles every screen. Nothing
    # here runs on a device - that is NOT VERIFIED in CI and the evidence
    # says so.
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install (from the lockfile)
        run: npm ci

      - name: Regenerate the client types from the contract
        run: npm run api:types

      - name: Fail if the generated types drifted from docs/api/openapi.candidate.v1.json
        run: |
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error::mobile/src/api/schema.d.ts is out of sync with the contract. Run 'npm run api:types' in mobile/ and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (client, cache policy, contract parity, contrast)
        run: npm test

      - name: Web bundle (Metro compiles every screen)
        run: npm run export:web

  generated-files:
    name: Generated-file determinism
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (from the lockfile)
        # `npm ci` is retried ONCE, and only for a specific known failure.
        #
        # esbuild's postinstall writes its binary and then immediately execs it
        # to check `--version`. On a busy runner the write handle may not be
        # closed yet, and the exec fails with ETXTBSY ("text file busy"). It
        # reached this project through @esbuild-kit/core-utils -> drizzle-kit ->
        # @payloadcms/db-*, a path no application code touches (drizzle-kit is
        # Payload's migration CLI and never runs in production).
        #
        # This is an installer race, not a lockfile problem: the same lockfile
        # installs cleanly from scratch locally, and the nested esbuild version
        # is identical on main. A single clean retry is the standard remedy.
        #
        # It is deliberately NOT silent. The retry prints a loud notice, so a
        # genuine install failure still shows up as a retry in the log rather
        # than being smoothed away, and a second failure fails the job.
        run: |
          if npm ci; then
            exit 0
          fi
          echo "::warning::npm ci failed on the first attempt. Cleaning node_modules and retrying once (see the ETXTBSY note in ci.yml)."
          rm -rf node_modules
          npm ci

      # importMap.js and payload-types.ts are tracked because a clean clone must
      # build without running codegen. That only works if they are in sync with
      # src/payload.config.ts. Regenerating and diffing turns "someone forgot to
      # regenerate" into a red build rather than a silent runtime mismatch in the
      # Payload admin. See docs/adr/ADR-0014-generated-files.md.
      - name: Regenerate the Payload import map
        run: npm run cms:importmap

      - name: Regenerate Payload types
        run: npm run cms:types

      - name: Fail if a generated file drifted
        run: |
          if ! git diff --exit-code -- 'src/app/(payload)/admin/importMap.js' src/payload-types.ts; then
            echo "::error::A generated file is out of sync with src/payload.config.ts."
            echo "Run 'npm run cms:importmap' and 'npm run cms:types', then commit the result."
            exit 1
          fi
          echo "Generated files are in sync."

      # scripts/payload-cli.mjs temporarily flips "type": "module" in
      # package.json and restores it. If a crash ever left it set, that is a real
      # defect and CI should say so rather than let it reach main.
      - name: Fail if package.json was left modified by the Payload CLI
        run: git diff --exit-code -- package.json

  line-endings:
    name: Line-ending policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # .gitattributes normalises every text file to LF. This proves the working
      # tree actually complies, which is what stops the recurring dirty-tree
      # churn Windows contributors saw on importMap.js before Stage 00.
      - name: Fail if renormalisation would change anything
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Files do not comply with .gitattributes (LF normalisation)."
            git diff --cached --name-only
            exit 1
          fi
          echo "All tracked files comply with the line-ending policy."
